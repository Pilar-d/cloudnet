<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar Sesión — NubePro</title>

  <style>
    :root{
      --bg:#0f1724; --muted:#a0aabe; --accent1:#7c3aed; --accent2:#06b6d4;
      --radius:16px; --shadow:0 8px 32px rgba(0,0,0,0.35);
      font-family: Inter, ui-sans-serif, system-ui;
      color-scheme: dark;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,var(--bg),#08101a);color:white;padding:20px}

    .card{
      background:rgba(255,255,255,0.03);
      width:100%; max-width:420px;
      padding:34px;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,0.04);
      animation:fadeUp .6s ease both;
    }

    @keyframes fadeUp{
      from{opacity:0;transform:translateY(20px)}
    }

    .logo{width:60px;height:60px;border-radius:18px;margin:0 auto 14px;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:grid;place-items:center}
    .logo svg{width:32px;height:32px}

    h1{text-align:center;margin-bottom:8px;font-size:22px}
    p.subtitle{text-align:center;margin-bottom:22px;font-size:14px;color:var(--muted)}

    label{font-size:14px;margin-bottom:6px;display:block;color:var(--muted)}
    input{width:100%;border-radius:12px;background:transparent;border:1px solid rgba(255,255,255,0.06);padding:12px;color:white;margin-bottom:14px;transition:.2s}
    input:focus{border-color:var(--accent2);outline:none}

    .btn{
      width:100%;padding:12px;font-weight:600;border-radius:14px;border:none;
      background:linear-gradient(90deg,var(--accent1),var(--accent2));
      color:white;box-shadow:var(--shadow);
      cursor:pointer;font-size:15px;margin-top:6px;transition:.3s
    }
    .btn:hover{opacity:.9;transform:translateY(-1px)}

    .footer{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
    .footer a{color:var(--accent2);text-decoration:none}
    .footer a:hover{text-decoration:underline}

  </style>
</head>
<body>

  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M7 18h10a4 4 0 0 0 0-8 5.5 5.5 0 0 0-10-1A4 4 0 0 0 7 18z" fill="white"/></svg>
    </div>

    <h1>Bienvenido</h1>
    <p class="subtitle">Accede a tu panel en la nube</p>

    <form id="loginForm" onsubmit="return false">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="usuario@empresa.com" required />

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="********" required />

      <button class="btn" onclick="location.href='interfaz-usuario.html'">Iniciar sesión</button>

    </form>

    <div class="footer">
      ¿No tienes cuenta? <a href="#">Crear cuenta</a>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(){
      const email = document.getElementById("email").value;
      alert("Bienvenido " + email + " — autenticación OK (simulada)");
    });
  </script>

</body>
</html>
